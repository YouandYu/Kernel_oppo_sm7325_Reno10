name: Build SukiSU-Ultra SuSFS Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu
          mkdir -p kernel

      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: miaizhe/Kernel_oppo_sm7325_Reno10
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_reno10

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz

      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules

      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Add SuSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs-patch -b gki-android12-5.10
          cp susfs-patch/kernel_patches/include/linux/susfs.h kernel/msm-5.4/include/linux/
          cp susfs-patch/kernel_patches/include/linux/susfs_def.h kernel/msm-5.4/include/linux/
          cp susfs-patch/kernel_patches/fs/susfs.c kernel/msm-5.4/fs/
          pwd
          cd kernel/msm-5.4
            curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh -o susfs_inline_hook_patches.sh
            chmod +x susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh || true
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
      - name: Add SukiSU-Ultra
        run: |
          cd kernel/msm-5.4/
          pwd
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          sed -i '/ksu_handle_setresuid/d' kernel/sys.c
          sed -i '/ksu_init_rc_hook/d' fs/read_write.c
          echo -e "\n#endif /* __KSU_H_KERNEL_COMPAT */" >> drivers/kernelsu/infra/kernel_compat.h
          sed -i '/#define __KSU_H_KERNEL_COMPAT/a #define KSU_COMPAT_USE_STATIC_KEY 1' drivers/kernelsu/infra/kernel_compat.h
          sed -i 's/&& KSU_COMPAT_USE_STATIC_KEY/&& defined(KSU_COMPAT_USE_STATIC_KEY)/g' drivers/kernelsu/runtime/ksud.c
          sed -i '/#define KSU_COMPAT_USE_STATIC_KEY 1/d' drivers/kernelsu/infra/kernel_compat.h
          sed -i 's/#define KSU_COMPAT_USE_STATIC_KEY$/#define KSU_COMPAT_USE_STATIC_KEY 1/g' drivers/kernelsu/infra/kernel_compat.h
          sed -i 's/&& KSU_COMPAT_USE_STATIC_KEY.*/\&\& defined(KSU_COMPAT_USE_STATIC_KEY)/g' drivers/kernelsu/runtime/ksud.c
          sed -i 's/\bstrncpy_from_user_nofault\b/ksu_strncpy_from_user_nofault/g' drivers/kernelsu/sulog/event.c
          echo "Checking fixed lines in event.c:"
          grep "strncpy_from_user_nofault" drivers/kernelsu/sulog/event.c
          sed -i 's/\.handle_inode_event/.handle_event/g' fssusfs.c

      - name: Build Kernel
        run: |
          pwd
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd kernel/msm-5.4/
          pwd
          make O=out CC="clang" LLVM=1 Reno10_defconfig
          echo "CONFIG_KSU_KPM=y" >> out/.config
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' out/.config
          make O=out CC="clang" LLVM=1 -j$(nproc)
          
      - name: Pack Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../kernel/msm-5.4/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-SukiSU-Ultra-SuSFS-Reno10-${{ env.BUILD_DATE }}.img
          cd ..

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=auto;|' AnyKernel3/anykernel.sh
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "感谢支持芜夕wuxi内核，刷入完成！"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary
          
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra-SuSFS-Reno10-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder
          
      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v6
        with:
          name: SukiSU-Ultra_Reno10_Flashable
          path: SukiSU-Ultra-Reno10-Kernel.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          name: SukiSU-Ultra Kernel for Reno10 (${{ env.BUILD_DATE }})
          body: |
            ## 编译完成
            - **内核版本**: 5.4.254
            - **SukiSU SHA**: `${{ env.SHORT_SHA }}`
            - **包含文件**: `boot.img` (直接镜像) 和 `AnyKernel3.zip` (Recovery刷机包)
            - 欢迎刷入芜夕wuxi的内核！
          files: |
            SukiSU-Ultra-SuSFS-Reno10-${{ env.BUILD_DATE }}.zip
            boot-SukiSU-Ultra-SuSFS-Reno10-${{ env.BUILD_DATE }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
