name: Build ZSTD test Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu 
          mkdir -p kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: miaizhe/Kernel_oppo_sm7325_Reno10
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_reno10

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz
      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules
      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          
      - name: rekernel
        run: |
          cd kernel/msm-5.4
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh
          mkdir -p drivers/rekernel
          curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch -o rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true

      - name: zstd test
        run: |
          git clone https://github.com/oppo-source/android_kernel_oppo_sm8450.git msm-5.10 --depth=1
          rm -r kernel/msm-5.4/lib/zstd
          cp -r msm-5.10/lib/zstd kernel/msm-5.4/lib/.
          rm -f kernel/msm-5.4/include/linux/zstd*.h
          cp -r msm-5.10/include/linux/zstd*.h kernel/msm-5.4/include/linux/
          cd kernel/msm-5.4/
          sed -i 's/zstd_init_cstream(&params, 0, workspace, workspace_size)/ZSTD_initCStream(&params, 0)/g' fs/f2fs/compress.c
          sed -i 's/zstd_init_dstream(max_window_size, workspace, workspace_size)/ZSTD_initDStream()/g' fs/f2fs/compress.c
          sed -i 's/zstd_cctx/ZSTD_CStream/g' crypto/zstd.c
          sed -i 's/zstd_dctx/ZSTD_DStream/g' crypto/zstd.c
          sed -i 's/zstd_parameters/ZSTD_parameters/g' crypto/zstd.c
          sed -i -e 's/\bzstd_get_params\b/ZSTD_getParams/g' -e 's/\bZSTD_CStream_workspace_bound\b/ZSTD_CStreamWorkspaceBound/g' -e 's/\bzstd_init_cctx\b/ZSTD_initCStream/g' -e 's/\bZSTD_DStream_workspace_bound\b/ZSTD_DStreamWorkspaceBound/g' -e 's/\bzstd_init_dctx\b/ZSTD_initDStream/g' -e 's/\bzstd_is_error\b/ZSTD_isError/g' -e '/return ZSTD_getParams(/c\	return ZSTD_getParams(ZSTD_DEF_LEVEL, 0, 0);' -e '/out_len = ZSTD_compressStream(zctx->cctx, dst, \*dlen, src, slen, &params);/c\	ZSTD_outBuffer output = { .dst = dst, .size = *dlen, .pos = 0 }; ZSTD_inBuffer input = { .src = src, .size = slen, .pos = 0 }; out_len = ZSTD_compressStream(zctx->cctx, &output, &input); *dlen = output.pos;' -e '/out_len = ZSTD_decompressStream(zctx->dctx, dst, \*dlen, src, slen);/c\	ZSTD_outBuffer output = { .dst = dst, .size = *dlen, .pos = 0 }; ZSTD_inBuffer input = { .src = src, .size = slen, .pos = 0 }; out_len = ZSTD_decompressStream(zctx->dctx, &output, &input); *dlen = output.pos;' crypto/zstd.c
          rm fs/f2fs/compress.c
          cd fs/f2fs/
          wget https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/compress.c
          cd ..
          cd ..
          sed -i \
            -e 's/\<zstd_cctx\>/ZSTD_CStream/g' \
            -e 's/\<zstd_dctx\>/ZSTD_DStream/g' \
            -e 's/\<zstd_parameters\>/ZSTD_parameters/g' \
            -e 's/\<zstd_init_cstream\>/ZSTD_initCStream/g' \
            -e 's/\<zstd_init_dstream\>/ZSTD_initDStream/g' \
            -e 's/\<zstd_compress_cctx\>/ZSTD_compressStream/g' \
            -e 's/\<zstd_decompress_dctx\>/ZSTD_decompressStream/g' \
            -e 's/\<zstd_cstream_workspace_bound\>/ZSTD_CStreamWorkspaceBound/g' \
            -e 's/\<zstd_dstream_workspace_bound\>/ZSTD_DStreamWorkspaceBound/g' \
            crypto/zstd.c

            sed -i -e 's/&params\.cParams/params.cParams/g' \
              -e 's/ZSTD_CStreamWorkspaceBound(\([^)]*\))/ZSTD_CStreamWorkspaceBound(\1)/g' \
              -e 's/ZSTD_DStreamWorkspaceBound()/ZSTD_DStreamWorkspaceBound(1 << 20)/g' \
              -e 's/ZSTD_initCStream(\([^,]*\), *\([^)]*\))/ZSTD_initCStream(params, \1, \2)/g' \
              -e 's/ZSTD_initDStream(\([^,]*\), *\([^)]*\))/ZSTD_initDStream(1 << 20, \1, \2)/g' \
              crypto/zstd.c
          
      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd kernel/msm-5.4
          sed -i '/source "utils\/Kconfig"/d' Kconfig
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          make O=out CC="clang" LLVM=1 Reno10_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK  \
            -e CONFIG_DOCKER
          ./scripts/config --file out/.config --enable NET --enable INET --enable NETFILTER --enable NETFILTER_XTABLES --enable NETFILTER_ADVANCED --enable IP_NF_MANGLE --enable NETFILTER_XT_TARGET_CHECKSUM
          ./scripts/config --file out/.config \
            --enable PID_NS --enable IPC_NS --enable POSIX_MQUEUE \
            --enable USER_NS \
            --enable CGROUP_PIDS --enable CGROUP_DEVICE --enable CGROUP_SCHED \
            --enable CPUSETS --enable MEMCG --enable BLK_CGROUP \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable VXLAN --enable BRIDGE_VLAN_FILTERING \
            --enable IPVLAN --enable MACVLAN \
            --enable BTRFS_FS --enable DM_THIN_PROVISIONING
          make O=out CC="clang" LLVM=1 -j$(nproc)
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "感谢支持芜夕wuxi内核，刷入完成！"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary
          
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/msm-5.4/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          cd AnyKernel3
          rm anykernel.sh
          wget https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/anykernel.sh
          zip -r9 ../ReSukiSU-Reno10-zstd-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder

          
      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v6
        with:
          name: ReSukiSU_Reno10_Flashable
          path: ReSukiSU-Reno10-zstd-${{ env.BUILD_DATE }}.zip
